name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Install isolated OpenCode v1 CLI
        run: npm --prefix /tmp/opencode-v1 install --no-save opencode-ai@1.18.29
      - name: Verify OpenCode v1 CLI
        run: /tmp/opencode-v1/node_modules/.bin/opencode --version
      - name: OpenCode v1 smoke test
        run: |
          OPENCODE_V1_ENTRY=legacy node test/opencode-v1-smoke.js
          OPENCODE_V1_ENTRY=server node test/opencode-v1-smoke.js
        env:
          OPENCODE_BIN: /tmp/opencode-v1/node_modules/.bin/opencode
      - name: Install pinned OpenCode v2 CLI (available npm beta)
        run: npm install --global @opencode-ai/cli@0.0.0-beta-19271
      - name: Verify OpenCode CLI
        run: |
          command -v opencode2
          opencode2 --version
      - name: OpenCode smoke test
        run: npm run test:opencode
        env:
          OPENCODE_BIN: opencode2
      - name: Install pinned official Codex CLI
        run: npm --prefix /tmp/codex-cli install --no-save @openai/codex@0.160.0
      - name: Codex integration tests
        run: npm run test:codex
        env:
          CODEX_TEST_BINARY: /tmp/codex-cli/node_modules/.bin/codex
      - name: Codex packed artifact and hook tests
        run: npm run test:codex:pack
        env:
          CODEX_TEST_BINARY: /tmp/codex-cli/node_modules/.bin/codex
      - name: Generate native Codex marketplace
        run: node src/cli.js package-codex --output /tmp/codegraph-codex-marketplace
      - name: Upload native Codex marketplace
        uses: actions/upload-artifact@v4
        with:
          name: codegraph-codex-marketplace
          path: /tmp/codegraph-codex-marketplace
          include-hidden-files: true
      - name: Package dry run
        run: npm pack --dry-run
